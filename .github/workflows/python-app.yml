# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # Poetry 1.2.x wants Python 3.10
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        poetry-version: [ "1.6.1", "2.2.1" ]
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: ${{ matrix.poetry-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          poetry install
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test and coverage with pytest
        run: |
          poetry run coverage run -m pytest 
          poetry run coverage report -m
      - name: Upload coverage data
        uses: actions/upload-artifact@v5
        with:
          # Create a unique name for each artifact using matrix variables
          name: covdata-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.poetry-version }}
          path: .coverage
          overwrite: true

  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: "2.2.1"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          poetry install
      - name: Download all coverage data
        uses: actions/download-artifact@v6
        with:
          pattern: covdata-*
          path: artifacts
      - name: Combine and calculate total coverage
        run: |
          echo "Combining coverage data from all matrix jobs..."
          
          # List downloaded artifacts
          ls -la artifacts/ || echo "No artifacts directory found"
          
          # Create artifacts directory if it doesn't exist
          mkdir -p artifacts
          
          # Check if we have any coverage files
          if [ -d "artifacts" ] && [ "$(find artifacts -name '.coverage' -type f | wc -l)" -gt 0 ]; then
            echo "Found $(find artifacts -name '.coverage' -type f | wc -l) coverage files"
          
            # Rename .coverage files so coverage.py can find them
            find artifacts -name '.coverage' -type f -exec sh -c 'cp "$1" ".coverage.$(echo "$1" | tr "/" "-" | sed "s/^artifacts-//")"' _ {} \;
          
            # List the renamed files
            ls -la .coverage.* || echo "No renamed coverage files"
          
            # Combine all .coverage.* files
            python -m coverage combine
          
            # Generate the JSON report
            python -m coverage json -o combined_coverage.json
          
            # Display the report
            python -m coverage report
          
            # Extract the total percentage from the combined JSON
            export TOTAL=$(python -c "import json;print(json.load(open('combined_coverage.json'))['totals']['percent_covered_display'])")
          
            echo "total=$TOTAL" >> $GITHUB_ENV
            echo "### Total coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage files found in artifacts"
            exit 1
          fi
      - name: Make badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          # GIST_TOKEN is a GitHub personal access token with scope "gist".
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 3c8214e2bd942821496440b93acd3582
          filename: covbadge.json
          label: Coverage
          message: ${{ env.total }}%
          minColorRange: 50
          maxColorRange: 90
          valColorRange: ${{ env.total }}